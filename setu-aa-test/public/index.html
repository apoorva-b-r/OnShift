<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Setu AA Consent Flow Tester</title>
  <style>
    :root {
      --bg-color: #0d1117;
      --card-bg: #161b22;
      --border-color: #30363d;
      --text-main: #c9d1d9;
      --text-muted: #8b949e;
      --primary: #238636;
      --primary-hover: #2ea043;
      --accent: #58a6ff;
      --error-bg: #f851491a;
      --error-border: #f85149;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      width: 100%;
      max-width: 520px;
      padding: 32px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }

    .badge {
      display: inline-block;
      padding: 3px 8px;
      font-size: 12px;
      font-weight: 600;
      color: var(--accent);
      background-color: rgba(56, 139, 253, 0.15);
      border-radius: 12px;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 22px;
      margin-bottom: 8px;
      color: #ffffff;
    }

    p.subtitle {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 6px;
      color: var(--text-main);
    }

    input[type="text"] {
      width: 100%;
      padding: 10px 14px;
      font-size: 15px;
      background-color: #0d1117;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: #ffffff;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      border-color: var(--accent);
    }

    .btn {
      width: 100%;
      padding: 12px;
      font-size: 15px;
      font-weight: 600;
      color: #ffffff;
      background-color: var(--primary);
      border: 1px solid rgba(240, 246, 252, 0.1);
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      transition: background-color 0.2s;
    }

    .btn:hover:not(:disabled) {
      background-color: var(--primary-hover);
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .status-box {
      margin-top: 20px;
      padding: 14px;
      border-radius: 6px;
      font-size: 13px;
      display: none;
      line-height: 1.4;
      word-break: break-word;
    }

    .status-box.error {
      display: block;
      background-color: var(--error-bg);
      border: 1px solid var(--error-border);
      color: #ff7b72;
    }

    .status-box.info {
      display: block;
      background-color: rgba(56, 139, 253, 0.1);
      border: 1px solid rgba(56, 139, 253, 0.4);
      color: #79c0ff;
    }

    pre {
      margin-top: 10px;
      background: #0d1117;
      padding: 10px;
      border-radius: 4px;
      font-size: 12px;
      overflow-x: auto;
      max-height: 200px;
    }

    .meta-list {
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid var(--border-color);
      font-size: 12px;
      color: var(--text-muted);
    }

    .meta-list li {
      margin-bottom: 4px;
      list-style-type: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <span class="badge">Hackathon Sandbox Tester</span>
    <h1>Link Bank Account</h1>
    <p class="subtitle">Test Setu Account Aggregator consent flow for gig-worker income verification.</p>

    <div class="form-group">
      <label for="mobileNumber">Mobile Number (AA Identifier)</label>
      <input type="text" id="mobileNumber" value="9999999999" placeholder="Enter 10-digit mobile number" maxlength="10">
    </div>

    <button id="submitBtn" class="btn" onclick="initiateConsent()">
      <span>Link Bank Account</span>
    </button>

    <div id="statusBox" class="status-box"></div>

    <ul class="meta-list">
      <li>• <strong>Purpose:</strong> 103 (Bank Statement Verification)</li>
      <li>• <strong>Consent Type:</strong> Transactions (Deposit accounts)</li>
      <li>• <strong>Period:</strong> Last 3 months</li>
    </ul>
  </div>

  <script>
    async function initiateConsent() {
      const mobileInput = document.getElementById('mobileNumber');
      const submitBtn = document.getElementById('submitBtn');
      const statusBox = document.getElementById('statusBox');

      const mobileNumber = mobileInput.value.trim();
      if (!mobileNumber) {
        showStatus('Please enter a valid mobile number', 'error');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span>Creating Consent...</span>';
      showStatus('Calling /api/create-consent...', 'info');

      try {
        const response = await fetch('/api/create-consent', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ mobile_number: mobileNumber })
        });

        const data = await response.json();

        if (!response.ok || !data.success) {
          submitBtn.disabled = false;
          submitBtn.innerHTML = '<span>Link Bank Account</span>';
          showStatus(`Failed to create consent:<br><pre>${JSON.stringify(data, null, 2)}</pre>`, 'error');
          return;
        }

        const consentHandle = data.consentHandle;
        const redirectUrl = data.url || `https://anumati.setu.co/${consentHandle}?redirect_url=${encodeURIComponent(data.redirectUrl)}`;

        showStatus(`Consent created! Handle: <strong>${consentHandle}</strong><br>Redirecting to Setu Anumati...`, 'info');

        setTimeout(() => {
          window.location.href = redirectUrl;
        }, 1200);

      } catch (err) {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<span>Link Bank Account</span>';
        showStatus(`Network Error: ${err.message}`, 'error');
      }
    }

    function showStatus(message, type) {
      const statusBox = document.getElementById('statusBox');
      statusBox.className = `status-box ${type}`;
      statusBox.innerHTML = message;
    }
  </script>
</body>
</html>
