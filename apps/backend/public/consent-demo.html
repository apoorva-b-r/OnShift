<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OnShift - Account Aggregator Consent Demo</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f8fafc; color: #1e293b; padding: 2rem; margin: 0; }
    .card { max-width: 600px; margin: 0 auto; background: #ffffff; border-radius: 12px; border: 1px solid #e2e8f0; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); padding: 2rem; }
    h1 { font-size: 1.5rem; color: #0f172a; margin-top: 0; margin-bottom: 0.5rem; display: flex; align-items: center; gap: 0.5rem; }
    p.desc { color: #64748b; font-size: 0.95rem; margin-bottom: 1.5rem; }
    .form-group { margin-bottom: 1.25rem; }
    label { display: block; font-weight: 600; font-size: 0.875rem; margin-bottom: 0.5rem; }
    input[type="text"] { width: 100%; padding: 0.625rem; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.95rem; box-sizing: border-box; }
    .btn-group { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1rem; }
    .btn { display: inline-block; background: #2563eb; color: #fff; border: none; padding: 0.75rem 1.25rem; border-radius: 6px; font-weight: 600; font-size: 0.95rem; cursor: pointer; transition: background 0.2s; }
    .btn:hover { background: #1d4ed8; }
    .btn-secondary { background: #64748b; }
    .btn-secondary:hover { background: #475569; }
    .btn-success { background: #16a34a; }
    .btn-success:hover { background: #15803d; }
    .status-box { margin-top: 1.5rem; padding: 1.25rem; background: #f0f9ff; border: 1px solid #bae6fd; border-radius: 8px; font-size: 0.9rem; }
    .badge { display: inline-block; padding: 0.25rem 0.625rem; border-radius: 12px; font-weight: 700; font-size: 0.8rem; text-transform: uppercase; }
    .badge-pending { background: #fef08a; color: #854d0e; }
    .badge-active { background: #bbf7d0; color: #166534; }
    code { background: #e0f2fe; padding: 0.2rem 0.4rem; border-radius: 4px; font-family: monospace; font-size: 0.9em; }
    .log-box { margin-top: 1rem; background: #0f172a; color: #38bdf8; padding: 1rem; border-radius: 6px; font-family: monospace; font-size: 0.85rem; max-height: 200px; overflow-y: auto; white-space: pre-wrap; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🏦 OnShift AA Consent Demo</h1>
    <p class="desc">Standalone separate UI for Account Aggregator consent request, OTP approval, and financial evidence normalization.</p>

    <div class="form-group">
      <label for="workerId">Worker ID:</label>
      <input type="text" id="workerId" value="OS-DEMO-001" placeholder="Enter worker ID..." />
    </div>

    <div class="btn-group">
      <button id="btnRequest" class="btn" onclick="requestConsent()">Request Financial Consent</button>
      <button id="btnCheck" class="btn btn-secondary" onclick="checkStatus()" style="display:none;">Check Consent Status</button>
      <button id="btnFetch" class="btn btn-success" onclick="fetchData()" style="display:none;">Fetch & Normalize Data</button>
    </div>

    <div id="statusContainer" style="display:none;" class="status-box">
      <div style="font-weight: 700; color: #0369a1; margin-bottom: 0.5rem;">Consent Request Active</div>
      <div style="margin-bottom: 0.4rem;"><strong>Consent ID:</strong> <code id="lblConsentId">--</code></div>
      <div style="margin-bottom: 0.4rem;"><strong>Status:</strong> <span id="lblStatus" class="badge badge-pending">PENDING</span></div>
      <div id="urlContainer" style="margin-top: 0.75rem;">
        <a id="lnkConsent" href="#" target="_blank" style="color: #0284c7; font-weight: 600; text-decoration: underline;">
          Re-open Authorization URL &rarr;
        </a>
      </div>
    </div>

    <div id="logBox" class="log-box" style="display:none;"></div>
  </div>

  <script>
    let currentToken = '';
    let currentConsentId = '';
    let currentConsentUrl = '';

    function log(msg) {
      const box = document.getElementById('logBox');
      box.style.display = 'block';
      box.textContent += `[${new Date().toLocaleTimeString()}] ${msg}\n`;
      box.scrollTop = box.scrollHeight;
    }

    async function getAuthToken(workerId) {
      log(`Logging in for workerId=${workerId}...`);
      const res = await fetch('/api/v1/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ workerId })
      });
      if (!res.ok) throw new Error(`Auth failed (${res.status})`);
      const data = await res.json();
      currentToken = data.token;
      log(`JWT token obtained successfully.`);
      return currentToken;
    }

    async function requestConsent() {
      const workerId = document.getElementById('workerId').value.trim() || 'OS-DEMO-001';
      document.getElementById('btnRequest').disabled = true;
      try {
        await getAuthToken(workerId);

        log(`Requesting consent via POST /api/v1/consent/request...`);
        const res = await fetch('/api/v1/consent/request', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${currentToken}`
          },
          body: JSON.stringify({ workerId, fiTypes: ['DEPOSIT'] })
        });

        if (!res.ok) throw new Error(`Consent request failed (${res.status})`);
        const data = await res.json();

        currentConsentId = data.consentId;
        currentConsentUrl = data.consentUrl;

        log(`Consent created! consentId=${currentConsentId}, status=${data.status}`);

        document.getElementById('statusContainer').style.display = 'block';
        document.getElementById('lblConsentId').textContent = currentConsentId;
        document.getElementById('lblStatus').textContent = data.status || 'PENDING';
        document.getElementById('lblStatus').className = `badge badge-${(data.status || 'PENDING').toLowerCase()}`;
        document.getElementById('lnkConsent').href = currentConsentUrl;

        document.getElementById('btnCheck').style.display = 'inline-block';
        document.getElementById('btnFetch').style.display = 'inline-block';

        log(`Opening authorization page in new tab...`);
        window.open(currentConsentUrl, '_blank');
      } catch (err) {
        log(`ERROR: ${err.message}`);
      } finally {
        document.getElementById('btnRequest').disabled = false;
      }
    }

    async function checkStatus() {
      if (!currentConsentId) return;
      try {
        log(`Checking status via GET /api/v1/consent/status/${currentConsentId}...`);
        const res = await fetch(`/api/v1/consent/status/${currentConsentId}`, {
          headers: { 'Authorization': `Bearer ${currentToken}` }
        });
        if (!res.ok) throw new Error(`Status check failed (${res.status})`);
        const data = await res.json();

        log(`Status result: ${data.status}`);
        document.getElementById('lblStatus').textContent = data.status;
        document.getElementById('lblStatus').className = `badge badge-${data.status.toLowerCase()}`;
      } catch (err) {
        log(`ERROR: ${err.message}`);
      }
    }

    async function fetchData() {
      if (!currentConsentId) return;
      try {
        log(`Fetching & normalizing financial data via POST /api/v1/consent/fetch-data...`);
        const res = await fetch('/api/v1/consent/fetch-data', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${currentToken}`
          },
          body: JSON.stringify({ consentId: currentConsentId })
        });
        if (!res.ok) throw new Error(`Fetch data failed (${res.status})`);
        const data = await res.json();

        log(`SUCCESS: Normalized ${data.evidenceCount} evidence records into MongoDB!`);
      } catch (err) {
        log(`ERROR: ${err.message}`);
      }
    }
  </script>
</body>
</html>
